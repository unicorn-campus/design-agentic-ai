[project]
name = "help-desk-p3-conversation-closed-event"
version = "0.1.0"
description = "상담 종료 이벤트 LangGraph 워크플로우"
requires-python = ">=3.12,<3.13"
dependencies = ["help-desk-common-runtime", "help-desk-tools"]

[dependency-groups]
dev = ["pytest>=8.4,<9.0", "pytest-mock>=3.14,<4.0"]

[tool.uv.sources]
help-desk-common-runtime = { path = "../../common", editable = true }
help-desk-tools = { path = "../../tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p3_conversation_closed_event"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_call: 실제 외부 시스템을 호출하는 시험"]
