[project]
name = "help-desk-p1-sync-inquiry"
version = "0.1.0"
description = "고객 문의 동기 처리 LangGraph 워크플로우"
requires-python = ">=3.12,<3.13"
dependencies = [
  "help-desk-common-runtime",
  "help-desk-tools",
  "sqlglot>=27.0,<28.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9.0", "pytest-mock>=3.14,<4.0"]

[tool.uv.sources]
help-desk-common-runtime = { path = "../../common", editable = true }
help-desk-tools = { path = "../../tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p1_sync_inquiry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_call: 실제 외부 시스템을 호출하는 시험"]
