[project]
name = "help-desk-dataset"
version = "0.1.0"
description = "Help Desk 정형 데이터 준비와 원천 품질 측정"
requires-python = ">=3.12,<3.13"
dependencies = [
  "help-desk-common-runtime",
  "httpx>=0.28,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlglot>=27.0,<28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-mock>=3.14,<4.0",
]

[tool.uv.sources]
help-desk-common-runtime = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["help_desk_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_call: 실제 외부 시스템을 호출하는 시험",
]
