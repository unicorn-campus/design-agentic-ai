[project]
name = "help-desk-common-runtime"
version = "0.1.0"
description = "Help Desk Agentic AI 공통 런타임"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "opentelemetry-api>=1.36,<2.0",
  "opentelemetry-sdk>=1.36,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-mock>=3.14,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["help_desk_runtime", "help_desk_guardrails", "help_desk_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_call: 실제 외부 시스템을 호출하는 시험",
]
