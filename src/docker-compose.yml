# 런치픽 로컬 실행 구성 — ⑦ 2절 배포 단위 표를 컨테이너로 옮긴 것.
#
# 런타임 이미지 4개(I-1·I-2·I-3·I-5) + 저장소 + 확인용 프런트.
# I-4 `lp-payment`는 이번 범위 밖임 — ③ 7절이 PAY 3건을 `범위외`(에이전트
# 자율 판단 없음)로 판정했고 E-5가 Mock이라 실제 키가 존재하지 않음(⑦ K-17).
#
# ⑦ 3절 포트 표 그대로:
#   I-1 만 외부 노출(설계 443/TLS 1.3 → 로컬은 8080으로 종단)
#   I-2·I-3 은 **열지 않음** — 클러스터 내부 서비스 포트만 가짐
#   I-5 는 포트 없음(예약 실행 · HTTP 수신 없음)
#
# 저장소는 전부 **런타임 밖**임(⑦ 5-1절 판정 — 6개 전부 `밖`).

name: lunchpick

services:
  # ── 저장소 (S-1 ~ S-8a · 런타임 밖) ─────────────────────────────────────────
  lp-postgres:
    image: postgres:16-alpine
    container_name: lp-postgres
    environment:
      POSTGRES_DB: ${LP_DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    volumes:
      - lp-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432" # 로컬 점검용. 운영에서는 열지 않음
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${LP_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── I-1 진입 이미지 lp-gateway — 유일한 외부 진입 지점 ──────────────────────
  lp-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: lp-gateway
    environment:
      # K-12 관측 기록 접속정보(쓰기 전용) + K-13 검증 키만 받음.
      # K-1·K-5 등은 주입하지 않음 — 게이트웨이가 쓰지 않는 키는 주지 않음
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_OBS_USER: ${LP_DB_OBS_USER}
      LP_DB_OBS_PASSWORD: ${LP_DB_OBS_PASSWORD}
      LP_JWT_SECRET: ${LP_JWT_SECRET}
      LP_MEMBER_BASE_URL: http://lp-member:8080
      LP_RECOMMEND_BASE_URL: http://lp-recommend:8080
    ports:
      - "8080:8080" # 설계상 443(TLS 1.3). 로컬은 프록시 없이 8080으로 종단
    depends_on:
      lp-recommend:
        condition: service_started
      lp-member:
        condition: service_started

  # ── I-2 추천 이미지 lp-recommend — FIL + AGT + HIS ──────────────────────────
  lp-recommend:
    build:
      context: .
      dockerfile: recommend/Dockerfile
    container_name: lp-recommend
    environment:
      # K-1 LLM 키는 **이 이미지만** 받음(⑦ 4-2 2판 정정)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LP_LLM_MODEL: ${LP_LLM_MODEL}
      LP_LLM_MODE: ${LP_LLM_MODE}
      # K-3 날씨 키 · K-14 푸시 자격증명
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      LP_WEATHER_MODE: ${LP_WEATHER_MODE}
      LP_PUSH_MODE: ${LP_PUSH_MODE}
      # K-5 알레르기 전용 키 — I-2·I-3 2개로 한정(⑦ 4-4절)
      LP_ALLERGEN_KEY: ${LP_ALLERGEN_KEY}
      LP_PII_KEY: ${LP_PII_KEY}
      # K-7 ~ K-12 저장소 — 조회는 읽기 전용 계정, 이력 쓰기는 rw
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_RO_USER: ${LP_DB_RO_USER}
      LP_DB_RO_PASSWORD: ${LP_DB_RO_PASSWORD}
      LP_DB_RW_USER: ${LP_DB_RW_USER}
      LP_DB_RW_PASSWORD: ${LP_DB_RW_PASSWORD}
      LP_DB_OBS_USER: ${LP_DB_OBS_USER}
      LP_DB_OBS_PASSWORD: ${LP_DB_OBS_PASSWORD}
      # ④ 10절 반복 상한 · ⑥ 임계값 — 원문에 값이 없어 태그로 남은 자리
      LP_MAX_REJECT_ITER: ${LP_MAX_REJECT_ITER:-3}
      LP_MAX_REFRESH_ITER: ${LP_MAX_REFRESH_ITER:-2}
      LP_CONFIDENCE_THRESHOLD: ${LP_CONFIDENCE_THRESHOLD:-0.35}
      LP_DISPLAY_NAME_MAX_LEN: ${LP_DISPLAY_NAME_MAX_LEN:-60}
      # ⚠️ S-R10 타임아웃. 기본값은 ④ 9-1절 **설계값 1,200ms**임.
      #    실측은 약 5,200ms라 설계값으로는 C-1이 매번 타임아웃해 L-2 폴백만 나감.
      #    실물 근거 문장을 보려면 덮어써야 하나, 덮어쓰면 ① Q-1 p95 3초가
      #    성립하지 않음. 어느 쪽이든 기동 로그와 관측 기록에 사실이 남음.
      LP_SR10_TIMEOUT_MS: ${LP_SR10_TIMEOUT_MS:-}
    expose:
      - "8080" # ⑦ 3절 — 클러스터 내부 서비스 포트만. 인터넷에 열지 않음
    depends_on:
      lp-postgres:
        condition: service_healthy

  # ── I-3 회원 이미지 lp-member — K-5를 갖는 두 이미지 중 하나 ────────────────
  lp-member:
    build:
      context: .
      dockerfile: member/Dockerfile
    container_name: lp-member
    environment:
      # K-4 카카오 시크릿은 **이 이미지만** 받음
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      LP_KAKAO_MODE: ${LP_KAKAO_MODE}
      LP_ALLERGEN_KEY: ${LP_ALLERGEN_KEY}
      LP_PII_KEY: ${LP_PII_KEY}
      LP_JWT_SECRET: ${LP_JWT_SECRET}
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_RO_USER: ${LP_DB_RO_USER}
      LP_DB_RO_PASSWORD: ${LP_DB_RO_PASSWORD}
      LP_DB_RW_USER: ${LP_DB_RW_USER}
      LP_DB_RW_PASSWORD: ${LP_DB_RW_PASSWORD}
      LP_DB_OBS_USER: ${LP_DB_OBS_USER}
      LP_DB_OBS_PASSWORD: ${LP_DB_OBS_PASSWORD}
    expose:
      - "8080" # 알레르기 전용 키를 갖는 이미지를 인터넷에 직접 열지 않음
    depends_on:
      lp-postgres:
        condition: service_healthy

  # ── I-5 예약 작업 이미지 lp-scheduled — 실행 프로파일 2개 ───────────────────
  # BAT 매일 03:00 1회 · SYNC 주기 갱신. 오토스케일링 대상 아님 · 동시 실행 1
  lp-scheduled-bat:
    build:
      context: .
      dockerfile: scheduled/Dockerfile
    container_name: lp-scheduled-bat
    # K-1 LLM 키를 주지 않음 — A-3은 모델 미사용이므로 키가 필요 없음(J-5)
    environment:
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_RO_USER: ${LP_DB_RO_USER}
      LP_DB_RO_PASSWORD: ${LP_DB_RO_PASSWORD}
      LP_DB_RW_USER: ${LP_DB_RW_USER}
      LP_DB_RW_PASSWORD: ${LP_DB_RW_PASSWORD}
      LP_DB_OBS_USER: ${LP_DB_OBS_USER}
      LP_DB_OBS_PASSWORD: ${LP_DB_OBS_PASSWORD}
    command: ["bat"]
    profiles: ["jobs"]
    depends_on:
      lp-postgres:
        condition: service_healthy

  lp-scheduled-sync:
    build:
      context: .
      dockerfile: scheduled/Dockerfile
    container_name: lp-scheduled-sync
    environment:
      # K-2 지도 API 키는 SYNC 프로파일이 받음(⑦ 4-2 K-2)
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      LP_PLACES_MODE: ${LP_PLACES_MODE}
      LP_DISPLAY_NAME_MAX_LEN: ${LP_DISPLAY_NAME_MAX_LEN:-60}
      LP_CACHE_FRESHNESS_MAX_SEC: ${LP_CACHE_FRESHNESS_MAX_SEC:-86400}
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_RO_USER: ${LP_DB_RO_USER}
      LP_DB_RO_PASSWORD: ${LP_DB_RO_PASSWORD}
      LP_DB_RW_USER: ${LP_DB_RW_USER}
      LP_DB_RW_PASSWORD: ${LP_DB_RW_PASSWORD}
      LP_DB_OBS_USER: ${LP_DB_OBS_USER}
      LP_DB_OBS_PASSWORD: ${LP_DB_OBS_PASSWORD}
    command: ["sync"]
    profiles: ["jobs"]
    depends_on:
      lp-postgres:
        condition: service_healthy

  # ── 합성 데이터 생성기 (배포 단위 아님 · 로컬 시드용) ───────────────────────
  lp-synth:
    build:
      context: .
      dockerfile: synth/Dockerfile
    container_name: lp-synth
    environment:
      LP_DB_HOST: lp-postgres
      LP_DB_NAME: ${LP_DB_NAME}
      LP_DB_RW_USER: ${LP_DB_RW_USER}
      LP_DB_RW_PASSWORD: ${LP_DB_RW_PASSWORD}
    profiles: ["seed"]
    depends_on:
      lp-postgres:
        condition: service_healthy

  # ── 확인용 프런트 — ⑦ I-6은 앱 스토어 배포라 컨테이너 대상이 아님.
  #    로컬 동작 확인 목적의 React 화면을 별도 컨테이너로 둠 ────────────────────
  lp-front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: lp-front
    ports:
      - "8081:80"
    depends_on:
      lp-gateway:
        condition: service_started

volumes:
  lp-pgdata:
