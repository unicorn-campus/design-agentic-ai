[project]
name = "help-desk-tools"
version = "0.1.0"
description = "Help Desk 외부 도구 커넥터 계층"
requires-python = ">=3.12,<3.13"
dependencies = [
  "help-desk-common-runtime",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-mock>=3.14,<4.0",
]

[tool.uv.sources]
help-desk-common-runtime = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["help_desk_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_call: 실제 외부 시스템을 호출하는 시험",
]
