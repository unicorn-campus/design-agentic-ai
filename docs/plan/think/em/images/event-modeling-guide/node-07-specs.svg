<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<rect width="1600" height="1080" fill="#F5F7FB"/>
<rect x="48" y="38" width="74" height="60" rx="16" fill="#18263D" stroke="#18263D" stroke-width="2"/>
<text x="85" y="80.47999999999999" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">07</text>
<text x="145" y="86.08" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#18263D">구체적인 예시로 사양 정하기</text>
<text x="148" y="127.68" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#5D6C83">이번 결과: 커맨드 또는 읽기 모델에 연결한 정상·예외 기준</text>
<polyline points="48,155 1552,155" fill="none" stroke="#B9C6D7" stroke-width="1" stroke-dasharray="none" stroke-linejoin="round"/>
<text x="50" y="1046.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">이탈 위험 방지 · Event Modeling 작성 예시</text>
<text x="1550" y="1046.04" text-anchor="end" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">가상 데이터 · 설계 제안</text>
<rect x="50" y="215" width="735" height="285" rx="18" fill="#E5EFFF" stroke="#3674CE" stroke-width="2"/>
<text x="68" y="245.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#3674CE">C-7 · 근거 선정</text>
<text x="68" y="289.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">정상 취합</text>
<text x="68" y="327.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  현황·유효 문단·관계 경로</text>
<text x="68" y="356.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   근거 선정 요청</text>
<text x="68" y="384.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   R-01 + 추가 소비 거절 제약</text>
<rect x="815" y="215" width="735" height="285" rx="18" fill="#E5EFFF" stroke="#3674CE" stroke-width="2"/>
<text x="833" y="245.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#3674CE">C-6 · 이탈 예측</text>
<text x="833" y="289.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">모델 연결 실패</text>
<text x="833" y="327.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  모델 미연결 또는 시간 초과</text>
<text x="833" y="356.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   고객 이탈 위험 예측 요청</text>
<text x="833" y="384.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   확률·등급 없음 · 확인 필요</text>
<rect x="50" y="550" width="735" height="285" rx="18" fill="#F0E8FF" stroke="#8058B2" stroke-width="2"/>
<text x="68" y="580.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#8058B2">C-9 · 반환 이력</text>
<text x="68" y="624.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">같은 요청 재시도</text>
<text x="68" y="662.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  Q-301 반환 이력 한 건</text>
<text x="68" y="691.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   같은 완료 기록 재시도</text>
<text x="68" y="719.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   E-9 한 건 · 새 E-8 없음</text>
<rect x="815" y="550" width="735" height="285" rx="18" fill="#F0E8FF" stroke="#8058B2" stroke-width="2"/>
<text x="833" y="580.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#8058B2">V-3 · 읽기 모델</text>
<text x="833" y="624.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">반환과 확인 구별</text>
<text x="833" y="662.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  E-9 있음 · E-10 없음</text>
<text x="833" y="691.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   반환 완료 · 확인 전</text>
<text x="833" y="719.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">         확인 완료로 표시하지 않음</text>
<rect x="50" y="903" width="1500" height="87" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="75" y="941.52" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#18263D">사양과 실행 결과는 다름</text>
<text x="75" y="975.36" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#5D6C83">예시의 기대 동작을 정한 것임. 실제 구현 후 같은 조건으로 결과를 확인해야 함.</text>
</svg>