<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<rect width="1600" height="1080" fill="#F5F7FB"/>
<rect x="48" y="38" width="74" height="60" rx="16" fill="#18263D" stroke="#18263D" stroke-width="2"/>
<text x="85" y="80.47999999999999" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">07</text>
<text x="145" y="86.08" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#18263D">구체적인 예시로 사양 정하기</text>
<text x="148" y="127.68" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#5D6C83">이번 결과: 커맨드 또는 읽기 모델에 연결한 정상·예외 기준</text>
<polyline points="48,155 1552,155" fill="none" stroke="#B9C6D7" stroke-width="1" stroke-dasharray="none" stroke-linejoin="round"/>
<text x="50" y="1046.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">이탈 위험 방지 · Event Modeling 작성 예시</text>
<text x="1550" y="1046.04" text-anchor="end" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">가상 데이터 · 설계 제안</text>
<rect x="50" y="215" width="735" height="285" rx="18" fill="#E5EFFF" stroke="#3674CE" stroke-width="2"/>
<text x="68" y="245.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#3674CE">C-2 · 질문 해석·경로 선택</text>
<text x="68" y="289.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">사용액만 물으면 C-3만 선택</text>
<text x="68" y="327.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  지난달 사용액 질문</text>
<text x="68" y="356.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   경로 결정 요청</text>
<text x="68" y="384.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   C-3 선택 / 나머지는 선택하지 않음</text>
<rect x="815" y="215" width="735" height="285" rx="18" fill="#E5EFFF" stroke="#3674CE" stroke-width="2"/>
<text x="833" y="245.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#3674CE">C-7 · 근거 선정</text>
<text x="833" y="289.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">완료 순서가 달라도 같은 근거</text>
<text x="833" y="327.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  같은 결과 · E-3/E-4 기록 순서만 다름</text>
<text x="833" y="356.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   취합 조건 충족 후 근거 선정 요청</text>
<text x="833" y="384.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   같은 R-01 / 계획별 중복 선정 없음</text>
<rect x="50" y="550" width="735" height="285" rx="18" fill="#F0E8FF" stroke="#8058B2" stroke-width="2"/>
<text x="68" y="580.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#8058B2">C-6 · 보조 이탈 예측</text>
<text x="68" y="624.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">시간 초과이면 예측 보류</text>
<text x="68" y="662.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  예측 요청 후 5초 초과</text>
<text x="68" y="691.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">When   예측 대기 종료</text>
<text x="68" y="719.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   보류 기록 / 확률·등급 없이 진행</text>
<rect x="815" y="550" width="735" height="285" rx="18" fill="#F0E8FF" stroke="#8058B2" stroke-width="2"/>
<text x="833" y="580.56" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#8058B2">V-3 · 읽기 모델</text>
<text x="833" y="624.32" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#18263D">필수 자료 실패이면 초안 보류</text>
<text x="833" y="662.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Given  C-5 실패 / 필수 자료 확보 중단</text>
<text x="833" y="691.04" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">Then   연결 확인 필요 표시</text>
<text x="833" y="719.54" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#5D6C83">         초안 없음 / E-7·E-8 없음</text>
<rect x="50" y="903" width="1500" height="87" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="75" y="941.52" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#18263D">사양과 실행 결과는 다름</text>
<text x="75" y="975.36" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#5D6C83">예시의 기대 동작을 정한 것임. 실제 구현 후 같은 조건으로 결과를 확인해야 함.</text>
</svg>