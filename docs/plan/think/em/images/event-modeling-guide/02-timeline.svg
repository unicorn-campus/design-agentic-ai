<text x="432" y="315.86" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#5D6C83">상담과 별도 주기로 실행</text>
<polyline points="580,343 580,395" fill="none" stroke="#36865B" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
<polygon points="580,395 573.4755169883315,381.49329346470984 586.5244830116685,381.49329346470984" fill="#36865B"/>
<text x="765" y="270.52" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#36865B">근거 선정에 사용할 색인이 먼저 준비됨</text>
<rect x="50" y="400" width="228" height="156" rx="18" fill="#FFF0D9" stroke="#D88A24" stroke-width="2"/>
<text x="72" y="435.88" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#D88A24">E-1</text>
<text x="72" y="478.0" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#18263D">상담 시작</text>
<text x="72" y="517.86" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#5D6C83">순서 1</text>
