name: lunchpick-v1-1

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    LUNCHPICK_DATABASE_URL: postgresql://lunchpick:${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}@postgres:5432/lunchpick
    LUNCHPICK_OTLP_ENDPOINT: ${LUNCHPICK_OTLP_ENDPOINT:-}
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  member-service:
    <<: *backend
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        APP_PORT: "8090"
    image: lunchpick/member-service:${LUNCHPICK_IMAGE_TAG:-local}
    environment:
      LUNCHPICK_SERVICE_PORT: "8090"
      LUNCHPICK_SERVICE_NAME: member-service
      LUNCHPICK_DATABASE_URL: postgresql://lunchpick:${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}@postgres:5432/lunchpick
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  recommendation-history-service:
    <<: *backend
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        APP_PORT: "8091"
    image: lunchpick/recommendation-history-service:${LUNCHPICK_IMAGE_TAG:-local}
    environment:
      LUNCHPICK_SERVICE_PORT: "8091"
      LUNCHPICK_SERVICE_NAME: recommendation-history-service
      LUNCHPICK_DATABASE_URL: postgresql://lunchpick:${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}@postgres:5432/lunchpick
      LUNCHPICK_OTLP_ENDPOINT: ${LUNCHPICK_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  payment-service:
    <<: *backend
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        APP_PORT: "8092"
    image: lunchpick/payment-service:${LUNCHPICK_IMAGE_TAG:-local}
    environment:
      LUNCHPICK_SERVICE_PORT: "8092"
      LUNCHPICK_SERVICE_NAME: payment-service
      LUNCHPICK_DATABASE_URL: postgresql://lunchpick:${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}@postgres:5432/lunchpick
      LUNCHPICK_OTLP_ENDPOINT: ${LUNCHPICK_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  daily-learning-batch:
    <<: *backend
    profiles: [jobs]
    restart: "no"
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        APP_PORT: "8093"
    image: lunchpick/daily-learning-batch:${LUNCHPICK_IMAGE_TAG:-local}
    command: ["python", "-m", "deploy.retention"]
    environment:
      LUNCHPICK_SERVICE_NAME: daily-learning-batch
      LUNCHPICK_DATABASE_URL: postgresql://lunchpick:${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}@postgres:5432/lunchpick

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: lunchpick/frontend:${LUNCHPICK_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunchpick
      POSTGRES_USER: lunchpick
      POSTGRES_PASSWORD: ${LUNCHPICK_POSTGRES_PASSWORD:?LUNCHPICK_POSTGRES_PASSWORD is required}
    volumes:
      # PostgreSQL 18+ 공식 이미지의 메이저 버전별 데이터 디렉터리 구조에 맞춘 상위 마운트임.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchpick -d lunchpick"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  frontend:
    internal: false
  backend:
    # 호스트 노출은 서비스별 `127.0.0.1` 바인딩으로 제한함. PostgreSQL은 포트를 게시하지 않음.
    internal: false

volumes:
  postgres-data:
