[project]
name = "lunchpick-services"
version = "0.1.0"
description = "런치픽 흐름 조립 계층 — ③ 90단계 노드 · ④ 16담당자 모듈 · 분기 · 착지 · 재개"
requires-python = "==3.12.*"

# 버전은 `==`로 정확히 고정함. 확인일 2026-08-08.
# `common`(01-runtime)·`toolkit`(04-connector)을 임포트하므로 그 의존성을 같은 버전으로 함께 적음.
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.5.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "anthropic==0.121.0",
    "psycopg[binary,pool]==3.3.4",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_call: 바깥 시스템을 실제로 부르는 시험. 기본 실행에서 제외되고 `-m live_call`로만 돎(D-07)",
]
addopts = "-m 'not live_call'"
pythonpath = [".."]
