[project]
name = "lunchpick-common"
version = "0.1.0"
description = "런치픽 공통 런타임 — 상태 정의·예산·설정 로더·중간 저장 장치·모델 어댑터"
requires-python = "==3.12.*"

# 버전은 `==`로 정확히 고정함. 확인일 2026-08-08 · uv pip compile(Python 3.12) 해석 결과임.
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.5.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "anthropic==0.121.0",
    "psycopg[binary,pool]==3.3.4",
    # 05-guardrail 추가분 — 관측 기록 규격과 표준 내보내기.
    # **관측 백엔드 제품 이름이 여기 없음**(D-11 `[확인필요]`). 내보낼 곳은 설정값으로만 옴.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_call: 바깥 시스템을 실제로 부르는 시험. 기본 실행에서 제외되고 `-m live_call`로만 돎(D-07)",
]
addopts = "-m 'not live_call'"
