# 검사 규칙 원본 — 이 파일이 1벌뿐임
#
# 여기 없는 조건을 코드에 박지 않음. 코드는 이 파일을 읽어 판정만 함.
# 각 행은 설계서 ⑥ 가드레일/관측의 행과 1:1로 대응함(대응표는 guardrail/README.md 3절).
#
# 소유 관계 — 이 파일이 정하는 것은 `설정 항목 이름`뿐임.
#   차단 규칙·출력측 검사·마스킹 방법·승인 지점 = ⑥ 소유(옮겨 적음)
#   민감 필드 ID(F-n)·변환 자리(SL-n)          = ⑤ · ② 소유(인용)
#   단계 목록·시간 상한·재시도·반복 상한        = ③ 소유(인용. 시간 값은 이 파일에 없음)
#   건당 단가                                  = ① 소유(환경변수 LUNCHPICK_COST_LIMIT_KRW_PER_REQUEST)
#
# 실제 열쇠·토큰·비밀번호는 이 파일에 없음. 자리표시 이름만 씀.
#
# TOML 주의 — 아래 배열들은 전부 뿌리(root) 키임. 그래서 `[표]` 머리글보다 **먼저** 적음.

