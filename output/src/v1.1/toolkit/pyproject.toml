[project]
name = "lunchpick-tools"
version = "0.1.0"
description = "런치픽 도구 계층 — 커넥터 어댑터 · 도구 정의 · 인증 · 승인 문 · 오류 분류"
requires-python = "==3.12.*"

# 버전은 `==`로 정확히 고정함. 확인일 2026-08-08 · uv pip compile(Python 3.12) 해석 결과임.
# `common`(01-runtime)을 임포트하므로 그 의존성을 같은 버전으로 함께 적음.
dependencies = [
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.5.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "anthropic==0.121.0",
    "psycopg[binary,pool]==3.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_call: 바깥 시스템을 실제로 부르는 시험. 기본 실행에서 제외되고 `-m live_call`로만 돎(D-07)",
]
addopts = "-m 'not live_call'"
pythonpath = [".."]
