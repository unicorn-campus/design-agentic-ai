<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title{font:800 46px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .subtitle{font:500 19px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .stage{font:800 23px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .stage-num{font:800 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .node-title{font:750 22px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .node-body{font:500 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .small-body{font:500 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .term{font:800 21px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .cond-title{font:750 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .cond-body{font:600 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .label{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
      .label-purple{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
      .label-orange{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
      .note{font:600 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#111111}
      .flow{fill:none;stroke:#334155;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#5f516f;stroke-width:3.5;stroke-dasharray:10 5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow-purple)}
      .rerank-flow{fill:none;stroke:#715a38;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow-orange)}
      .repair-flow{fill:none;stroke:#715a38;stroke-width:4;stroke-dasharray:9 5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow-orange)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#5f516f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#715a38"/>
    </marker>
    <linearGradient id="navy" x1="0" x2="1"><stop offset="0" stop-color="#e5eef6"/><stop offset="1" stop-color="#e5eef6"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop offset="0" stop-color="#e2f0eb"/><stop offset="1" stop-color="#e2f0eb"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop offset="0" stop-color="#eee8f5"/><stop offset="1" stop-color="#eee8f5"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop offset="0" stop-color="#f6e8d2"/><stop offset="1" stop-color="#f6e8d2"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#e4eaf4"/><stop offset="1" stop-color="#e4eaf4"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#f5e4e4"/><stop offset="1" stop-color="#f5e4e4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#183b65" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="52" y="58" class="title">RetrieverResources 워크플로우</text>
  <text x="54" y="86" class="subtitle">원 질문 검색을 기준으로 변환 필요성을 판단하고, 필요한 경우에만 변환 질문 검색을 확장함</text>

  <!-- Stage A: gate and planning -->
  <rect x="28" y="108" width="1864" height="248" rx="22" fill="#f3f7fa" stroke="#b7c7d5" stroke-width="2"/>
  <circle cx="56" cy="137" r="17" fill="#e5eef6" stroke="#315e85" stroke-width="2.5"/>
  <text x="56" y="143" text-anchor="middle" class="stage-num">A</text>
  <text x="82" y="145" class="stage">변환 필요성 판단</text>

  <rect x="58" y="192" width="108" height="58" rx="14" fill="url(#red)" stroke="#934a4a" stroke-width="3" filter="url(#shadow)"/>
  <text x="112" y="229" text-anchor="middle" class="term">START</text>

  <g filter="url(#shadow)">
    <rect x="202" y="171" width="236" height="100" rx="16" fill="url(#navy)" stroke="#315e85" stroke-width="3"/>
    <text x="320" y="202" text-anchor="middle" class="node-title">1. check_query</text>
    <text x="320" y="231" text-anchor="middle" class="node-body">질문·검색 조건·권한 검사</text>
    <text x="320" y="254" text-anchor="middle" class="small-body">인덱스 상태·임베딩 서명 확인</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="486" y="171" width="252" height="100" rx="16" fill="url(#navy)" stroke="#315e85" stroke-width="3"/>
    <text x="612" y="202" text-anchor="middle" class="node-title">2. vector_search</text>
    <text x="612" y="231" text-anchor="middle" class="node-body">원 질문 벡터 검색 1회</text>
    <text x="612" y="254" text-anchor="middle" class="small-body">변환 판단 점수 기록</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="786" y="158" width="338" height="112" rx="16" fill="url(#navy)" stroke="#315e85" stroke-width="3"/>
    <text x="955" y="194" text-anchor="middle" class="node-title">3. assess_transform_gate</text>
    <text x="955" y="224" text-anchor="middle" class="node-body">LLM 없이 변환 계획</text>
    <text x="955" y="248" text-anchor="middle" class="node-body">검토 여부 판정</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210" y="252" width="360" height="90" rx="15" fill="url(#purple)" stroke="#6f5a8e" stroke-width="3"/>
    <text x="1390" y="281" text-anchor="middle" class="node-title">4. plan_query_transform</text>
    <text x="1390" y="309" text-anchor="middle" class="node-body">캐시·LLM으로 변환 계획 생성</text>
    <text x="1390" y="332" text-anchor="middle" class="small-body">기법·질의 개수 규칙 검증</text>
  </g>

  <path class="flow" d="M166 221 H202"/>
  <path class="flow" d="M438 221 H486"/>
  <path class="flow" d="M738 221 H786"/>
  <path class="branch" d="M955 270 V327 H1210"/>
  <rect x="790" y="277" width="408" height="47" rx="10" fill="#fff" fill-opacity="0.94"/>
  <text x="805" y="297" class="label-purple">검토 필요 · auto</text>
  <text x="805" y="317" class="label-purple">score &lt; 0.70 또는 검색 결과 없음</text>
  <path class="flow" d="M1124 205 H1720 V327"/>
  <text x="1190" y="192" class="label">계획 생략 · off 또는 score ≥ 0.70</text>
  <path class="branch" d="M1570 301 H1720 V327"/>
  <circle cx="1720" cy="327" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>

  <!-- Stage B: original query result -->
  <rect x="28" y="374" width="1864" height="220" rx="22" fill="#f3f8f6" stroke="#b7ccc5" stroke-width="2"/>
  <circle cx="56" cy="403" r="17" fill="#e2f0eb" stroke="#35766b" stroke-width="2.5"/>
  <text x="56" y="409" text-anchor="middle" class="stage-num">B</text>
  <text x="82" y="411" class="stage">원 질문 결과 완성</text>

  <rect x="1690" y="464" width="158" height="66" rx="33" fill="#fff" stroke="#596474" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1769" y="491" text-anchor="middle" class="cond-title">검색 모드</text>
  <text x="1769" y="515" text-anchor="middle" class="cond-body">vector / hybrid 계열</text>
  <path class="flow" d="M1720 335 V464"/>

  <g filter="url(#shadow)">
    <rect x="1360" y="453" width="260" height="92" rx="16" fill="url(#teal)" stroke="#35766b" stroke-width="3"/>
    <text x="1490" y="489" text-anchor="middle" class="node-title">5. bm25_search</text>
    <text x="1490" y="520" text-anchor="middle" class="node-body">원 질문 BM25 검색</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="990" y="453" width="300" height="92" rx="16" fill="url(#teal)" stroke="#35766b" stroke-width="3"/>
    <text x="1140" y="484" text-anchor="middle" class="node-title">6. fuse_scores</text>
    <text x="1140" y="512" text-anchor="middle" class="node-body">벡터·BM25 가중 점수 융합</text>
    <text x="1140" y="535" text-anchor="middle" class="small-body">권한에 맞는 후보만 유지</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="530" y="438" width="390" height="112" rx="16" fill="url(#teal)" stroke="#35766b" stroke-width="3"/>
    <text x="725" y="477" text-anchor="middle" class="node-title">7. complete_original_results</text>
    <text x="725" y="510" text-anchor="middle" class="node-body">원 질문 baseline·hits 확정</text>
    <text x="725" y="534" text-anchor="middle" class="small-body">미변환 경로 답변 관문 평가</text>
  </g>

  <path class="flow" d="M1690 499 H1620"/>
  <path class="flow" d="M1360 499 H1290"/>
  <path class="flow" d="M990 499 H920"/>
  <path class="flow" d="M1690 483 V425 H725 V438"/>
  <text x="1115" y="417" class="label">vector · 2번 vector_hits 재사용</text>

  <!-- Stage C: transformed query and result ordering -->
  <rect x="28" y="612" width="1864" height="220" rx="22" fill="#f7f4fa" stroke="#c9bdd7" stroke-width="2"/>
  <circle cx="56" cy="641" r="17" fill="#eee8f5" stroke="#6f5a8e" stroke-width="2.5"/>
  <text x="56" y="647" text-anchor="middle" class="stage-num">C</text>
  <text x="82" y="649" class="stage">변환 질문 검색·결과 정리</text>

  <rect x="76" y="689" width="230" height="74" rx="35" fill="#fff" stroke="#596474" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="191" y="719" text-anchor="middle" class="cond-title">transformed_queries</text>
  <text x="191" y="745" text-anchor="middle" class="cond-title">있음?</text>
  <path class="flow" d="M725 550 V672 H191 V689"/>

  <g filter="url(#shadow)">
    <rect x="348" y="667" width="414" height="130" rx="16" fill="url(#purple)" stroke="#6f5a8e" stroke-width="3"/>
    <text x="555" y="698" text-anchor="middle" class="node-title">8. search_transformed</text>
    <text x="555" y="726" text-anchor="middle" class="small-body">변환 질문별 순차 검색</text>
    <text x="555" y="750" text-anchor="middle" class="small-body">vector: 벡터 검색</text>
    <text x="555" y="773" text-anchor="middle" class="small-body">hybrid 계열: 벡터 + BM25 + 점수 융합</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="681" width="318" height="102" rx="16" fill="url(#purple)" stroke="#6f5a8e" stroke-width="3"/>
    <text x="979" y="713" text-anchor="middle" class="node-title">9. merge_queries</text>
    <text x="979" y="742" text-anchor="middle" class="node-body">원·변환 질문 가중 RRF 병합</text>
    <text x="979" y="768" text-anchor="middle" class="small-body">분해 질문 커버리지 보장</text>
  </g>
  <rect x="1192" y="693" width="190" height="78" rx="38" fill="#fff" stroke="#596474" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1287" y="723" text-anchor="middle" class="cond-title">hybrid_rerank?</text>
  <text x="1287" y="749" text-anchor="middle" class="cond-body">10번 수행 여부</text>
  <g filter="url(#shadow)">
    <rect x="1430" y="681" width="284" height="102" rx="16" fill="url(#orange)" stroke="#986c2a" stroke-width="3"/>
    <text x="1572" y="719" text-anchor="middle" class="node-title">10. rerank</text>
    <text x="1572" y="750" text-anchor="middle" class="node-body">후보군별 관련도 재평가</text>
    <text x="1572" y="773" text-anchor="middle" class="small-body">리랭킹 결과 최종 병합</text>
  </g>
  <rect x="1760" y="695" width="116" height="74" rx="18" fill="#fff" stroke="#596474" stroke-width="3"/>
  <text x="1818" y="724" text-anchor="middle" class="cond-title">검색 결과</text>
  <text x="1818" y="749" text-anchor="middle" class="cond-title">준비</text>

  <path class="branch" d="M306 726 H348"/>
  <text x="320" y="715" class="label-purple">있음</text>
  <path class="branch" d="M762 732 H820"/>
  <path class="branch" d="M1138 732 H1192"/>
  <path class="rerank-flow" d="M1382 732 H1430"/>
  <text x="1392" y="719" class="label-orange">예</text>
  <path class="rerank-flow" d="M1714 732 H1760"/>
  <path class="flow" d="M1287 693 V664 H1818 V695"/>
  <text x="1465" y="656" class="label">아니오 · vector / hybrid</text>
  <path class="flow" d="M191 763 V810 H1287 V771"/>
  <text x="535" y="804" class="label">없음 · 8–9번 생략</text>

  <!-- Stage D: answer and evidence -->
  <rect x="28" y="850" width="1864" height="202" rx="22" fill="#f3f5f9" stroke="#bbc5d4" stroke-width="2"/>
  <circle cx="56" cy="879" r="17" fill="#e4eaf4" stroke="#526a91" stroke-width="2.5"/>
  <text x="56" y="885" text-anchor="middle" class="stage-num">D</text>
  <text x="82" y="887" class="stage">답변 생성·근거 검증</text>
  <text x="365" y="884" class="note">오류 · dry_run · clarify · 한도 도달은 해당 단계에서 조기 종료</text>

  <g filter="url(#shadow)">
    <rect x="1350" y="913" width="292" height="92" rx="16" fill="url(#blue)" stroke="#526a91" stroke-width="3"/>
    <text x="1496" y="943" text-anchor="middle" class="node-title">11. build_prompt</text>
    <text x="1496" y="971" text-anchor="middle" class="node-body">검색 근거·질문으로 구성</text>
    <text x="1496" y="994" text-anchor="middle" class="small-body">재작성 시 보완 지침 포함</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="986" y="913" width="292" height="92" rx="16" fill="url(#blue)" stroke="#526a91" stroke-width="3"/>
    <text x="1132" y="943" text-anchor="middle" class="node-title">12. generate_answer</text>
    <text x="1132" y="971" text-anchor="middle" class="node-body">LLM으로 근거 기반</text>
    <text x="1132" y="994" text-anchor="middle" class="small-body">구조화 답변 생성</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="598" y="913" width="316" height="92" rx="16" fill="url(#blue)" stroke="#526a91" stroke-width="3"/>
    <text x="756" y="943" text-anchor="middle" class="node-title">13. verify_evidence</text>
    <text x="756" y="971" text-anchor="middle" class="node-body">답변 형식·인용·위치 검증</text>
    <text x="756" y="994" text-anchor="middle" class="small-body">실패 시 보완 지침 생성</text>
  </g>
  <rect x="392" y="928" width="142" height="62" rx="15" fill="url(#red)" stroke="#934a4a" stroke-width="3" filter="url(#shadow)"/>
  <text x="463" y="967" text-anchor="middle" class="term">END</text>

  <path class="flow" d="M1818 769 V959 H1642"/>
  <text x="1662" y="949" class="label">answer_enabled=True</text>
  <path class="flow" d="M1350 959 H1278"/>
  <path class="flow" d="M986 959 H914"/>
  <path class="flow" d="M598 959 H534"/>
  <text x="540" y="947" class="label">검증 통과</text>

  <path class="repair-flow" d="M756 1005 V1032 H1496 V1005"/>
  <text x="1045" y="1026" class="label-orange">근거 보완 · repair</text>

  <rect x="1648" y="861" width="224" height="56" rx="13" fill="#fff" stroke="#596474" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1760" y="884" text-anchor="middle" class="cond-body">answer_enabled=False</text>
  <text x="1760" y="906" text-anchor="middle" class="cond-title">검색 결과에서 종료</text>
</svg>
